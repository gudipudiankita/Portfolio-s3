
name: S3 Portfolio Terraform CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      operation:
        description: "Choose Terraform operation"
        type: choice
        options:
          - apply
          - destroy
        default: apply
        required: true

      confirm_destroy:
        description: "Type DESTROY to confirm deletion"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Display Portfolio Website URL
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: |
          echo "## Portfolio Website" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open My Portfolio]($(terraform output -raw portfolio_website_url))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Website URL: $(terraform output -raw portfolio_website_url)"

      - name: Check Destroy Confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "Destroy cancelled. Enter DESTROY to confirm."
          exit 1

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy == 'DESTROY'
        run: terraform destroy -input=false -auto-approve
